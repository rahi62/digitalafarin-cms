name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-django build twine
          python -m pip install -e "./packages/cms-django[all]"
      - name: Run Django package tests
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
          PYTHONPATH: packages/cms-django
        run: python -m pytest packages/cms-django/tests -q
      - name: Check Django configuration and migration drift
        if: matrix.python-version == '3.13'
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
          PYTHONPATH: packages/cms-django
        run: |
          python -m django check
          python -m django makemigrations --check --dry-run
          python scripts/verify-routing-migration.py
      - name: Build Python distributions
        if: matrix.python-version == '3.13'
        run: python -m build packages/cms-django --outdir dist/python
      - name: Validate Python distributions
        if: matrix.python-version == '3.13'
        run: python -m twine check dist/python/*
      - name: Smoke test installed Python wheel
        if: matrix.python-version == '3.13'
        run: |
          python -m venv .smoke-python
          .smoke-python/bin/python -m pip install --upgrade pip
          .smoke-python/bin/python -m pip install dist/python/*.whl
          .smoke-python/bin/python scripts/smoke-python-package.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cms_test
          POSTGRES_PASSWORD: cms-test-only
          POSTGRES_DB: cms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cms_test -d cms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PostgreSQL test dependencies
        run: python -m pip install pytest pytest-django -e "./packages/cms-django[postgres]"
      - name: Verify backend and concurrent refresh on PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: tests.postgres_settings
          PYTHONPATH: packages/cms-django
          CMS_TEST_POSTGRES_PORT: "5432"
        run: python -m pytest packages/cms-django/tests -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify locked Node toolchain
        run: |
          node --version
          npm --version
          test -f package-lock.json
          node -e "const l=require('./package-lock.json'); if(l.lockfileVersion<1) process.exit(1); console.log('lockfileVersion='+l.lockfileVersion)"
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types --test apps/admin/test/*.test.mjs
      - run: npm run check:versions
      - run: npm --workspace packages/cms-next run build
      - run: npm --workspace packages/cms-next run typecheck
      - run: npm --workspace packages/cms-next run test:rich-text
      - run: npm run test:integration
      - run: npm --workspace apps/admin run typecheck
      - run: npm --workspace apps/admin run build
      - run: npm --workspace examples/next-site run build
      - name: Install Chromium for editor browser tests
        run: npx playwright install --with-deps chromium
      - name: Verify production CSP and nonce hydration
        run: npm run test:e2e:security
      - run: npm run test:e2e:editor
      - name: Verify HttpOnly BFF session and CSRF
        run: npm run test:e2e:bff
      - name: Install Django package for host integration E2E
        run: python -m pip install -e "./packages/cms-django[all]"
      - run: npm run test:e2e:host
      - name: Smoke test installed npm tarballs
        run: node scripts/smoke-npm-packages.mjs
      - name: Verify packed Admin in a Next 15 host without preinstalled tooling
        env:
          CMS_SMOKE_HOST_NEXT: "15.5.28"
        run: node scripts/smoke-npm-packages.mjs
      - name: Inspect npm package contents
        run: |
          npm --workspace apps/admin run pack:check
          npm --workspace packages/cms-next run pack:check
          npm --workspace packages/cms-cli run pack:check


