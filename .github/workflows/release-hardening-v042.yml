name: Harden v0.4.2 release

on:
  push:
    branches:
      - release/v0.4.2-prep

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.4.2-prep
      - name: Add v0.4.2 release notes and regression assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          block = '''## [0.4.2] - 2026-08-24

### Fixed

- Disabled Next.js framework-level trailing-slash redirects in the visual Admin so same-origin proxy requests such as `/cms/api-proxy/auth/token/` reach the route handler instead of returning HTTP 308 before proxying.
- Preserved Django endpoint trailing slashes end-to-end through the Admin proxy, preventing authentication POST requests from being rewritten before they reach Django.
- Added package smoke coverage requiring scaffolded Admin applications to include `skipTrailingSlashRedirect: true`.

'''
          marker = '## [0.4.1] - 2026-08-24\n'
          if '## [0.4.2]' not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG insertion marker not found')
              text = text.replace(marker, block + marker, 1)
              changelog.write_text(text)

          smoke = Path('scripts/smoke-npm-packages.mjs')
          text = smoke.read_text()
          needle = '  const proxyRoute = fs.readFileSync(path.join(directAdmin, "src", "app", "api-proxy", "[...path]", "route.ts"), "utf8");\n'
          insertion = '  const nextConfig = fs.readFileSync(path.join(directAdmin, "next.config.ts"), "utf8");\n  if (!nextConfig.includes("skipTrailingSlashRedirect: true")) throw new Error("Admin must disable Next trailing-slash redirects before API proxy routing");\n'
          if 'Admin must disable Next trailing-slash redirects' not in text:
              if needle not in text:
                  raise SystemExit('Smoke-test insertion marker not found')
              text = text.replace(needle, insertion + needle, 1)
              smoke.write_text(text)
          PY
      - name: Commit release hardening
        run: |
          if git diff --quiet; then
            echo "Release hardening already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md scripts/smoke-npm-packages.mjs
          git commit -m "test: cover Admin trailing slash redirect config"
          git push origin HEAD:release/v0.4.2-prep
