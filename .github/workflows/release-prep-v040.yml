name: Prepare v0.4.0 Versions

on:
  push:
    branches:
      - release/v0.4.0-prep

permissions:
  contents: write

jobs:
  version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.4.0-prep
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Set synchronized version
        run: node scripts/set-version.mjs 0.4.0
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit version files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/admin/package.json packages/cms-next/package.json packages/cms-cli/package.json packages/cms-django/pyproject.toml packages/cms-django/src/digitalafarin_cms/__init__.py
          if git diff --cached --quiet; then
            echo "Versions already synchronized."
            exit 0
          fi
          git commit -m "release: set v0.4.0 versions"
          git push origin HEAD:release/v0.4.0-prep
