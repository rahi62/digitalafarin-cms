name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm run check:versions
      - run: npm --workspace packages/cms-next run build
      - run: npm --workspace apps/admin run typecheck
      - name: Smoke test npm release tarballs
        run: node scripts/smoke-npm-packages.mjs
      - id: version
        name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION" || { echo "Tag $VERSION does not match package version $PACKAGE_VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build packages/cms-django --outdir dist/python
          python -m twine check dist/python/*
      - name: Smoke test installed Python wheel
        run: |
          python -m venv .smoke-python
          .smoke-python/bin/python -m pip install --upgrade pip
          .smoke-python/bin/python -m pip install dist/python/*.whl
          .smoke-python/bin/python scripts/smoke-python-package.py
      - id: exists
        name: Check whether version already exists on PyPI
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          python - <<'PY'
          import os, urllib.error, urllib.request
          version=os.environ['VERSION']
          url=f'https://pypi.org/pypi/digitalafarin-cms/{version}/json'
          try:
              urllib.request.urlopen(url, timeout=15)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print('Version is not on PyPI yet.')
                  with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('exists=false\n')
              else:
                  raise
          else:
              print('Version already exists on PyPI; skipping publish.')
              with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('exists=true\n')
          PY
      - name: Publish to PyPI via OIDC
        if: steps.exists.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Ensure npm CLI supports Trusted Publishing
        run: npm install --global npm@11
      - run: npm install --ignore-scripts
      - run: npm run check:versions
      - run: npm --workspace packages/cms-next run build
      - name: Publish Next.js SDK if missing
        working-directory: packages/cms-next
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          if npm view "@digitalafarin/cms-next@$VERSION" version >/dev/null 2>&1; then
            echo "@digitalafarin/cms-next@$VERSION already exists; skipping."
          else
            npm publish --access public
          fi
      - name: Publish CLI if missing
        working-directory: packages/cms-cli
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          if npm view "@digitalafarin/cms-cli@$VERSION" version >/dev/null 2>&1; then
            echo "@digitalafarin/cms-cli@$VERSION already exists; skipping."
          else
            npm publish --access public
          fi
      - name: Publish CMS Admin if missing
        working-directory: apps/admin
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          if npm view "@digitalafarin/cms-admin@$VERSION" version >/dev/null 2>&1; then
            echo "@digitalafarin/cms-admin@$VERSION already exists; skipping."
          else
            npm publish --access public
          fi

  github-release:
    needs: [verify, publish-pypi, publish-npm]
    if: always() && needs.verify.result == 'success' && needs.publish-pypi.result == 'success' && needs.publish-npm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: gh release create "v$VERSION" --generate-notes --title "DigitalAfarin CMS v$VERSION"
