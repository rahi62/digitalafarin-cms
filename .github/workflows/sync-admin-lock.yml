name: Sync Admin Lockfile

on:
  push:
    branches:
      - agent/path-admin-v0.4

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/path-admin-v0.4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Refresh package-lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit package-lock if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync cms-admin workspace lockfile"
          git push origin HEAD:agent/path-admin-v0.4
