services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seocms
      POSTGRES_USER: seocms
      POSTGRES_PASSWORD: seocms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seocms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    command: sh -c "python manage.py migrate && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./apps/backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    command: celery -A config worker -l info
    volumes:
      - ./apps/backend:/app
    depends_on:
      - backend
      - redis

  beat:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    command: celery -A config beat -l info
    volumes:
      - ./apps/backend:/app
    depends_on:
      - backend
      - redis

  admin:
    build: ./apps/admin
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/cms/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
